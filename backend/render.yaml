# Render Blueprint — lets you deploy this backend via "New +" -> "Blueprint"
# in the Render dashboard instead of manually filling in every field by
# hand. Secrets (anything with `sync: false`) are never committed here —
# Render prompts for the real value once, in its own dashboard, at deploy
# time.
#
# rootDir matters: this repo is a monorepo (backend/ + frontend/ as
# siblings) — without it, Render would try to `pip install` from the repo
# root, which has no requirements.txt at all.
services:
  - type: web
    name: ai-architect-backend
    runtime: python
    rootDir: backend
    plan: free
    # Free tier is a single instance by default (no autoscaling) — this
    # matters beyond cost: rate_limit.py's in-memory per-IP counters only
    # produce correct limits on exactly one process. Don't raise this to
    # multiple instances without first moving that to a Redis-backed
    # store (see that module's own comment on why).
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      # Required — the app fails fast on startup without it (see
      # db/client.py). Your Supabase project's connection string
      # (Project Settings -> Database -> Connection string -> URI, the
      # "Transaction" pooler mode one).
      - key: SUPABASE_DB_URL
        sync: false
      # Required — the one hard dependency; every other provider below is
      # optional and additive (see llm/factory.py's real fallback chain).
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Optional, tried FIRST when set — OpenRouter's `:free`-suffixed
      # models have NO token-per-minute ceiling at all, just a request-
      # rate limit. Absent key, this degrades to Groq-only, unchanged
      # from before this existed. The model below churns (OpenRouter's
      # free-model roster changes without notice — confirmed live within
      # this same session); check GET /models against your own account if
      # this one's ever pulled and swap the value here.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      # Optional, tried LAST — a real 1B tokens/month free, but only 1
      # request/second, a third safety net rather than where most traffic
      # should land.
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      # Optional, NOT in the active provider chain right now (see
      # llm/factory.py's own comment) — its free trial now requires a
      # verified payment method. Safe to set; simply unused until that's
      # resolved.
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      # Optional — absent key just skips the judge pass (see
      # services/interview.py), not a crash.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Optional — absent key just skips web-search grounding for
      # time-sensitive advisory answers (see services/web_search.py).
      - key: TAVILY_API_KEY
        sync: false
      # Required for the deployed frontend to actually be allowed to call
      # this API — set to your real Vercel URL(s), comma-separated if
      # more than one (e.g. a production + a preview domain). Defaults to
      # localhost only, which will silently block every request from the
      # deployed frontend if left unset.
      - key: CORS_ORIGINS
        sync: false
